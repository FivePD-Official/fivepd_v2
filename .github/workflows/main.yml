name: Main

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Test .NET
        run: |
          dotnet restore
          sudo dotnet build
          cd ./src/FivePD.UnitTests
          sudo dotnet test --verbosity detailed

