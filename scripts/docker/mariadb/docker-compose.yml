version: '3.1'

services:
  db:
    image: mariadb:latest
    container_name: my-mariadb
    environment:
      MYSQL_DATABASE: fivepd
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: root
    ports:
      - '3307:3306'
    volumes:
      - db:/var/lib/mysql

volumes:
  db:
