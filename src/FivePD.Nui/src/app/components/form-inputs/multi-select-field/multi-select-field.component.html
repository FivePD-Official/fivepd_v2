<app-base-field [field]="field" [form]="form" [control]="control">
  <div class="dropdown"
       (clickOutside)="open = false"
       [ngClass]="{
          'dropdown--open': open,
          'dropdown--normal': !field.size || field.size === 'normal',
          'dropdown--small': field.size === 'small',
          'dropdown--readonly': field.readonly
         }">
    <input [formControl]="control" [attr.id]="field.key" type="number" class="hidden"/>
    <div class="dropdown-selected-item"
         [ngClass]="dropdownSelectedItemClassName"
         (click)="toggleDropdown()">
      <p class="z-10"
         [ngClass]="{
              'text-zinc-400': field.readonly || field.variant === 'secondary',
              'text-white': field.variant === 'tertiary' || field.variant === 'tertiary-bg'
            }">{{ dropdownSelectedItemLabel | translate }}</p>
      <svg class="z-10" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
           stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
      </svg>
    </div>
    <div class="dropdown-items">
      <div class="dropdown-items--inner">
        @for (item of dropdownFilteredItems;track item) {
          <button type="button" class="item" (click)="onDropdownSelect(item)">
            <svg xmlns="http://www.w3.org/2000/svg"
                 fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
                 class="h-6 w-6 text-zinc-300 pr-2"
                 [ngClass]="{'opacity-0': !isItemSelected(item)}">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
            </svg>
            <p class="text-left">{{ item.label }}</p>
          </button>
        }
      </div>
    </div>
  </div>
</app-base-field>
