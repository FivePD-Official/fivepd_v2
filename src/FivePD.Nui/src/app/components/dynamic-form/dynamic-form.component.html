<form class="relative flex flex-col items-start max-w-[350px] self-center"
      [ngClass]="{ 'max-w-none': !limitWidth }"
      [formGroup]="form"
      (ngSubmit)="internalOnSubmit()">
  <div class="mb-6" *ngIf="title || subtitle">
    <p *ngIf="title" class="text-xl font-bold text-zinc-200 mb-1.5">{{ title }}</p>
    <p *ngIf="subtitle" class="text-zinc-400">{{ subtitle }}</p>
  </div>
  <div class="grid gap-7 w-full" *ngIf="form && formFieldColumns.length" [ngStyle]="{ grid: columnsGridStyle }">
    <div *ngFor="let col of formFieldColumns">
      <app-dynamic-form-input *ngFor="let field of col"
                              [field]="field"
                              [form]="form"
                              class="w-full block [&:not(:last-of-type)]:mb-5"/>
    </div>
  </div>
  <div *ngIf="!content.children.length"
       class="w-full flex flex-row items-center justify-end mt-6"
       [ngClass]="{
        'justify-start': buttonAlignment === 'left' || buttonAlignment === 'full',
        'justify-end': buttonAlignment === 'right'
       }">
    <app-button type="submit"
                [label]="submitButtonLabel || ('Nui.Actions.Save' | translate)"
                [disabled]="form.invalid || (disableSubmitWithOriginalValue && form.pristine)"/>
  </div>
  <div class="w-full" #content>
    <ng-content/>
  </div>
</form>
