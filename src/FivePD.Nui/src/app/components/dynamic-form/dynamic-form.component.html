<form class="relative flex flex-col items-start max-w-[350px] self-center"
      [ngClass]="{ 'max-w-none': !limitWidth }"
      [formGroup]="form"
      (ngSubmit)="internalOnSubmit()">
  @if (title || subtitle) {
    <div class="mb-6">
      @if (title) {
        <p class="text-xl font-bold text-zinc-200 mb-1.5">{{ title }}</p>
      }
      @if (subtitle) {
        <p class="text-zinc-400">{{ subtitle }}</p>
      }
    </div>
  }
  @if (form && formFieldColumns.length) {
    <div class="grid gap-7 w-full" [ngStyle]="{ grid: columnsGridStyle }">
      @for (col of formFieldColumns;track col) {
        <div>
          @for (field of col;track field) {
            <app-dynamic-form-input [field]="field"
                                    [form]="form"
                                    class="w-full block [&:not(:last-of-type)]:mb-5"/>
          }
        </div>
      }
    </div>
  }
  @if (showSubmitButton) {
    <div class="w-full flex flex-row items-center justify-end mt-6 gap-4"
         [ngClass]="{
      'justify-start': buttonAlignment === 'left' || buttonAlignment === 'full',
      'justify-end': buttonAlignment === 'right'
    }">
      @if (disableSubmitWithOriginalValue) {
        <app-button type="button"
                    variant="secondary"
                    (onClick)="revert()"
                    [label]="'UI.ACTION.REVERT' | translate"
                    [disabled]="disableSubmitWithOriginalValue && form.pristine"/>
      }
      <app-button type="submit"
                  [label]="submitButtonLabel || ('UI.ACTION.SAVE' | translate)"
                  [disabled]="form.invalid || (disableSubmitWithOriginalValue && form.pristine)"/>
    </div>
  }
</form>
