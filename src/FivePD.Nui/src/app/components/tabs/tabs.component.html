<div class="mb-6 grid grid-rows-1 grid-flow-col gap-2 bg-zinc-800 p-1 rounded-lg border border-zinc-700">
  @for (tab of tabs; track tab) {
    @if (tab.disabled && tab.disabled()) {
      <div [attr.data-testid]="'tab - ' + tab.label"
           class="group rounded-md h-[40px] cursor-not-allowed flex flex-row items-center justify-center">
        <p class="text-center text-zinc-400 group-[.active]:text-zinc-100">{{ tab.label | translate }}</p>
      </div>
    } @else {
      <button type="button"
              [attr.data-testid]="'tab - ' + tab.label"
              class="group rounded-md h-[40px] cursor-pointer hover:bg-zinc-700 flex flex-row items-center justify-center"
              (click)="onTabSelected(tab)"
              [ngClass]="activeTab === tab ? 'bg-zinc-700 active' : ''">
        <p class="text-center text-zinc-400 group-[.active]:text-zinc-100">{{ tab.label | translate }}</p>
      </button>
    }
  }
</div>

@if (displayChildren) {
  <div>
    <ng-content select="app-tab" />
  </div>
}
