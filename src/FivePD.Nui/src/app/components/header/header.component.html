<header>
  <div class="department">
    <img src="" alt="">
    <p>{{ (user$ | async)?.Department?.Name ?? 'Not in dept' }}</p>
  </div>
  <div class="side-row">
    <div class="status-select" (clickOutside)="closeStatusSelect()" [ngClass]="{ 'status-select--open': isStatusSelectOpened }">
      <button class="status-select-btn" (click)="toggleStatusSelect()">
        <p>{{ 'Nui.Labels.Status' | translate }}: {{ currentStatus }}</p>
        <div class="icon" app-icon name="ChevronDown"></div>
      </button>
      <div *ngIf="isStatusSelectOpened" class="status-select-list">
        <button *ngFor="let status of statusList" (click)="changeStatus(status)">
          {{ status }}
        </button>
      </div>
    </div>
    <p class="user">
      Logged in as <b>{{ (user$ | async)?.Name }}</b>
    </p>
    <button class="close-btn" (click)="window.hide()">
     <div app-icon name="XMark"></div>
    </button>
  </div>
</header>
