<header class="relative z-50 w-full h-[80px] flex flex-row items-center justify-between border-b border-color pl-8">
  <ng-container *ngIf="!dispatchMode; else dispatch">
    <div class="flex flex-row items-center">
      <p class="text-lg font-bold text-zinc-200">
        {{ user?.Department?.Name ?? ('UI.LABEL.NOT_IN_DEPARTMENT' | translate) }}
      </p>
    </div>
  </ng-container>
  <ng-template #dispatch>
    <app-button (onClick)="disableDispatchMode()" variant="tertiary" label="Exit dispatch mode"/>
  </ng-template>
  <div class="flex flex-row items-center h-full">
    <p class="text-zinc-200 px-8">
      Logged in as <b>{{ user?.Name }}</b>
    </p>
    <button class="group w-[80px] h-full flex flex-col items-center justify-center border-l border-color cursor-pointer"
            (click)="window.closeMDT()">
      <div app-icon name="XMark" className="h-[30px] text-zinc-500 group-hover:text-white"></div>
    </button>
  </div>
</header>
