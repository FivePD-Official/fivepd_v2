<div class="modal-backdrop">
  <div
    #modalContainer
    class="modal"
    [ngClass]="{ 'modal-wide': modalRef.options.columns ? modalRef.options.columns > 1 : false }"
  >
    <div class="modal-header">
      <div class="modal-header-top">
        <p class="title">{{ title | translate }}</p>
        <button (click)="close()" class="close-btn">
          <div class="icon" app-icon name="XMark"></div>
        </button>
      </div>
      <p *ngIf="description" class="description" [innerHtml]="description | safeHtml"></p>
    </div>
    <div class="modal-content" #modalContent></div>
  </div>
</div>
