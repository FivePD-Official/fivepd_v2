<div class="absolute inset-0 w-full h-full bg-zinc-900/90 z-50 rounded-xl flex flex-col items-center justify-center animate-fadeIn">
  <div #modalContainer
       class="px-6 py-4 rounded-lg bg-zinc-800 animate-modal"
       [ngClass]="{
        'w-[30vw]': (modalRef.options.columns || 1) > 1,
        'w-[500px]': (modalRef.options.columns || 1) === 1
       }">
    <div class="mb-6">
      <div class="flex flex-row items-center justify-between">
        <p class="text-2xl font-bold text-zinc-100">{{ modalRef.options.title | translate }}</p>
        <button (click)="close()"
                class="group flex flex-row items-center justify-between p-4 py-2 pr-0 rounded-full border-none cursor-pointer">
          <div app-icon
               name="XMark"
               className="h-[22px] text-zinc-400 group-hover:text-white">
          </div>
        </button>
      </div>
      <p *ngIf="modalRef.options.description" class="text-zinc-400 text-lg mt-1" [innerHtml]="modalRef.options.description | safeHtml"></p>
    </div>
    <div>
      <div #modalContent></div>
      <div class="w-full flex flex-row items-center justify-between mt-7">
        <div *ngIf="loader; else noLoader"
        class="flex flex-row items-center gap-3">
          <div class="w-[20px] h-[20px] rounded-full border-2 border-zinc-600 border-b-zinc-200 animate-spin"></div>
          <p class="text-zinc-300">{{ loader.label }}</p>
        </div>
        <ng-template #noLoader>
          <div></div>
        </ng-template>
        <div class="flex flex-row items-center justify-end gap-2.5">
          <app-button
            *ngIf="modalRef.options.buttons?.cancel"
            type="button"
            [variant]="modalRef.options.buttons!.cancel.variant"
            [label]="modalRef.options.buttons!.cancel.label | translate"
            (onClick)="close()"/>
          <app-button
            *ngIf="modalRef.options.buttons?.submit"
            [variant]="modalRef.options.buttons!.submit.variant"
            [label]="modalRef.options.buttons!.submit.label | translate"
            [disabled]="!!loader"
            (onClick)="submit()"/>
        </div>
      </div>
    </div>
  </div>
</div>
