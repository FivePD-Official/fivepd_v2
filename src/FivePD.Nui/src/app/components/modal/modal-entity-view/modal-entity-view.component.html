@if (entityValueColumns.length) {
  <div class="grid gap-7 w-full" [ngStyle]="{ grid: columnsGridStyle }">
    @for (col of entityValueColumns;track col) {
      <div>
        @for (item of col;track item) {
          <div class="mb-5">
            <p class="font-medium text-zinc-400 mb-1.5">{{ item.name }}</p>
            @if (typeof(item.value) === 'string') {
              <p class="text-zinc-200">{{ item.value }}</p>
            } @else {
              <div class="flex flex-col gap-2.5">
                @for (link of $any(item.value);track link) {
                  <button (click)="onLinkClick(link)"
                          class="group flex flex-row items-center text-zinc-300 hover:text-white">
                    {{ link.label }}
                    <div app-icon name="Link" className="ml-2.5 h-[20px] text-zinc-300 group-hover:text-white"></div>
                  </button>
                }
              </div>
            }
          </div>
        }
      </div>
    }
  </div>
}
