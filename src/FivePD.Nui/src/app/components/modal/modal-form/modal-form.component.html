<app-dynamic-form
  *ngIf="modalRef.options.fields?.length"
  [formFields]="modalRef.options.fields!"
  [limitWidth]="false"
  (onSubmit)="submit($event)"
  [columns]="modalRef.options.columns || 1">
  <div class="buttons-wrapper">
    <div class="buttons">
      <app-button
        [variant]="modalRef.options.buttons?.cancel?.variant ?? 'secondary'"
        [label]="modalRef.options.buttons?.cancel?.label ?? 'Nui.Actions.Cancel' | translate"
        (onClick)="close()"/>
      <app-button
        type="submit"
        [variant]="modalRef.options.buttons?.submit?.variant ?? 'primary'"
        [label]="modalRef.options.buttons?.submit?.label ?? 'Nui.Actions.Save' | translate"/>
    </div>
  </div>
</app-dynamic-form>
<div *ngIf="!modalRef.options.fields?.length" class="buttons-wrapper">
  <div class="buttons">
    <app-button
      [variant]="modalRef.options.buttons?.cancel?.variant ?? 'secondary'"
      [label]="modalRef.options.buttons?.cancel?.label ?? 'Nui.Actions.Cancel' | translate"
      (onClick)="close()"/>
    <app-button
      type="submit"
      [variant]="modalRef.options.buttons?.submit?.variant ?? 'primary'"
      [label]="modalRef.options.buttons?.submit?.label ?? 'Nui.Actions.Save' | translate"
      (onClick)="submit()"/>
  </div>
</div>
