@if (generalConfig?.mdtAccessOnlySpecificLocations() || generalConfig?.mdtAccessOnlyVehicleAndSpecificLocations()) {
  <app-grid [title]="'UI.LABEL.LOCATION.TYPE.MDT.TITLE.PLURAL' | translate"
            [data]="mdtAccessPointsPage$ | async"
            [buttons]="mdtAccessPointsButtons"
            [columns]="mdtAccessPointsColumns"
            (onCollationChange)="mdtAccessPointsCollation$.next($event)"/>
}
