<app-page-header [title]="'UI.LABEL.SETTINGS' | translate"/>

<app-container [rows]="2" [columns]="1">
  @if (this.userService.userHasRole(UserRole.Admin)) {
    <app-grid [title]="'Users' | translate"
              [columns]="usersColumns"
              [data]="users"
              (onCollationChange)="onUsersCollationChange($event)"/>
  }


  <app-grid
    [title]="'UI.LABEL.DEPARTMENT.PLURAL' | translate"
    [buttons]="departmentsButtons"
    [data]="departments"
    [columns]="departmentsColumnDef"
    (onCollationChange)="onDepartmentsCollationChange($event)"
    (onCellAction)="getDepartments()"/>
  @if (this.userService.userHasRole(UserRole.Admin)) {
    <app-grid [title]="'Callouts' | translate"
              [columns]="calloutDetailsColumns"
              [data]="calloutDetails"
              (onCollationChange)="onCalloutDetailsCollationChange($event)"/>

    <app-grid [title]="'UI.LABEL.ATTRIBUTE.PLURAL' | translate"
              [buttons]="attributesButtons"
              [columns]="attributesColumns"
              [data]="attributePage"
              (onCollationChange)="onAttributesCollationChange($event)">
      <app-dynamic-form-input [field]="setAttributeDropdown"
                              (onChange)="onTableCellActionSelect($event)"/>
    </app-grid>
  }


</app-container>
