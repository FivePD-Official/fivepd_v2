<app-container [rows]="2" [columns]="1">

  <app-grid [title]="'LABEL.VEHICLE_CONFIG.TYPE.POLICE.TITLE' | translate"
            [data]="policeVehicleConfigPage$ | async"
            [buttons]="policeVehicleConfigButtons"
            [columns]="policeVehicleConfigColumns"
            (onCollationChange)="policeVehicleConfigCollation$.next($event)"/>

  @if (this._userService.userHasRole(UserRole.Admin)) {
    <app-grid [title]="'LABEL.VEHICLE_CONFIG.TYPE.AMBULANCE.TITLE' | translate"
              [data]="ambulanceVehicleConfigPage$ | async"
              [buttons]="ambulanceVehicleConfigButtons"
              [columns]="ambulanceVehicleConfigColumns"
              (onCollationChange)="ambulanceVehicleConfigCollation$.next($event)"/>

    <app-grid [title]="'LABEL.VEHICLE_CONFIG.TYPE.TOW.TITLE' | translate"
              [data]="towTruckVehicleConfigPage$ | async"
              [buttons]="towTruckVehicleConfigButtons"
              [columns]="towTruckVehicleConfigColumns"
              (onCollationChange)="towTruckVehicleConfigCollation$.next($event)"/>

    <app-grid [title]="'LABEL.VEHICLE_CONFIG.TYPE.RIDE_SHARE.TITLE' | translate"
              [data]="rideShareVehicleConfigPage$ | async"
              [buttons]="rideShareVehicleConfigButtons"
              [columns]="rideShareVehicleConfigColumns"
              (onCollationChange)="rideShareVehicleConfigCollation$.next($event)"/>

    <app-grid [title]="'LABEL.VEHICLE_CONFIG.TYPE.CORONER.TITLE' | translate"
              [data]="coronerVehicleConfigPage$ | async"
              [buttons]="coronerVehicleConfigButtons"
              [columns]="coronerVehicleConfigColumns"
              (onCollationChange)="coronerVehicleConfigCollation$.next($event)"/>
  }
</app-container>
