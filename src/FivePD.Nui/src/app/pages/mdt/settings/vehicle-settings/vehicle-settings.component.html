<app-page-header [title]="'UI.LABEL.VEHICLE_SETTINGS' | translate"/>

<app-container [rows]="2" [columns]="1">

  <app-grid
    [title]="'UI.LABEL.VEHICLE_SETTINGS_POLICE' | translate"
    [buttons]="vehicleConfigbuttons"
    [columns]="policeConfigColumn"/>

  @if (this.userService.userHasRole(UserRole.Admin)){
    <app-grid
      [title]="'UI.LABEL.VEHICLE_SETTINGS_AMBULANCE' | translate"
      [buttons]="vehicleConfigbuttons"/>

    <app-grid
      [title]="'UI.LABEL.VEHICLE_SETTINGS_TOW' | translate"
      [buttons]="vehicleConfigbuttons"/>
  }
</app-container>
