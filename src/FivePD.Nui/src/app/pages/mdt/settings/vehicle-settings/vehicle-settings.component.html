<app-page-header [title]="'UI.LABEL.VEHICLE_SETTINGS.TITLE' | translate"/>

<app-container [rows]="2" [columns]="1">

  <app-grid
    [title]="'UI.LABEL.VEHICLE_SETTINGS.POLICE' | translate"
    [buttons]="vehicleConfigbuttons"

  @if (this.userService.userHasRole(UserRole.Admin)){

      [title]="'UI.LABEL.VEHICLE_SETTINGS.AMBULANCE' | translate"/>

    <app-grid
      [title]="'UI.LABEL.VEHICLE_SETTINGS.TOW' | translate"/>
  }
</app-container>
