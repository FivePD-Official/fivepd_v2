<div class="relative inset-0 w-full h-full grid grid-rows-1 grid-cols-2 gap-6 pt-10">
  <div class="w-full flex flex-col">
    <p class="common-title">Incoming callouts</p>
    <div class="w-full flex flex-col mt-4">
      <div *ngFor="let callout of incomingCallouts" class="rounded-lg bg-zinc-800 p-4 mb-4 flex flex-col gap-2">
        <div class="w-full flex flex-row items-center justify-between">
          <p class="text-lg font-medium text-zinc-100">{{ callout.Callout.Title }}</p>
          <p class="text-sm font-medium text-zinc-400">Auto-cancel in: {{ callout.timeout }}s</p>
        </div>
        <div class="grid grid-rows-1 grid-cols-[2fr_1fr] gap-4">
          <div>
            <p class="text-zinc-400">{{ callout.Callout.Description }}</p>
            <div class="mt-4 w-full flex flex-row items-center justify-start gap-4">
              <p class="text-zinc-300">{{ getPriorityLabel(callout) | translate }}</p>
              <div class="h-[20px] w-[1px] bg-zinc-400"></div>
              <p class="text-zinc-300">{{ callout.Address }}</p>
            </div>
          </div>
          <div class="w-full flex flex-col items-end justify-start">
            <div class="grid grid-cols-1 grid-flow-row gap-2">
              <app-button [fullWidth]="true"
                          label="Jump to marker"
                          variant="tertiary-bg"
                          (onClick)="jumpToCallout(callout)"/>
              <app-button [fullWidth]="true"
                          label="Dismiss"
                          variant="secondary"
                          (onClick)="dismissCallout(callout)"/>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="relative inset-0 w-full h-full">
    <div id="map" class="w-full h-full bg-zinc-900"></div>
  </div>
</div>
