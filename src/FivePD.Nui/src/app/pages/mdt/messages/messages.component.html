<app-page-header title="Messages">
  <app-button *ngIf="config?.canSendMessageAll()"
              label="Send message"
              (onClick)="trySendMessage()"/>
</app-page-header>

<div class="w-full flex flex-col items-center">
  <div *ngIf="!messagesPage?.Items?.length" class="mt-10">
    <p class="text-zinc-400 block text-xl">You have no messages.</p>
  </div>
</div>

<div *ngIf="messagesPage?.Items?.length"
     class="w-full grid grid-rows-1 grid-cols-[3fr_7fr] gap-8">

  <div class="flex flex-col">
    <button *ngFor="let message of messagesPage?.Items; let i = index"
            class="p-4 flex flex-col items-start justify-start border-t border-l border-r border-color"
            [ngClass]="{
              'hover:bg-zinc-800':  message.Id !== selectedMessage?.Id,
              'bg-zinc-800':  message.Id === selectedMessage?.Id,
              'rounded-tl-md rounded-tr-md': i === 0,
              'rounded-bl-md rounded-br-md border-b-[1px]': i === (messagesPage?.Items?.length ?? 1) - 1
            }"
            type="button"
            (click)="onMessageClick(message)">
      <div class="flex flex-row items-center gap-2">
        <span *ngIf="!message.Read" class="relative flex h-3 w-3">
          <span class="relative inline-flex rounded-full h-3 w-3 bg-primary"></span>
        </span>
        <p class="text-zinc-200 text-lg font-bold">{{ message.Subject }}</p>
      </div>
      <div class="w-full flex flex-row items-center justify-between">
        <p class="text-zinc-400 text-left">
          Sent by <span class="font-bold">{{ message.Sender }}</span>
        </p>
        <p class="text-zinc-400 text-right">
          {{ message.SentAt | date: 'medium' }}
        </p>
      </div>
      <div class="mt-4">
        <p class="line-clamp-1 text-zinc-400 text-left">{{ message.Content }}</p>
      </div>
    </button>

    <div *ngIf="(messagesPage?.PageCount ?? 1) > 1"
         class="pagination w-full flex flex-row items-center justify-end pt-4 mt-5">
      <div class="flex flex-row items-center">
        <button [disabled]="messagesCollation.Page === 1" (click)="toPreviousPage()" class="arrow"
                [ngClass]="{'arrow-disabled': messagesCollation.Page === 1}">
          <div app-icon name="ChevronLeft" className="h-[22px] text-zinc-200"
               [ngClassName]="{'text-zinc-500': messagesCollation.Page === 1}"></div>
          <span>{{ 'UI.LABEL.DIRECTION.PREVIOUS' | translate }}</span>
        </button>
        <button *ngIf="messagesCollation.Page > 1" (click)="toPage(messagesCollation.Page - 1)">
          <span>{{ messagesCollation.Page - 1 }}</span>
        </button>
        <button class="active">
          <span>{{ messagesCollation.Page }}</span>
        </button>
        <button *ngIf="messagesCollation.Page < (messagesPage ? messagesPage!.PageCount : 1)"
                (click)="toPage(messagesCollation.Page + 1)">
          <span>{{ messagesCollation.Page + 1 }}</span></button>
        <button [disabled]="messagesCollation.Page === (messagesPage ? messagesPage!.PageCount : 1)"
                (click)="toNextPage()" class="arrow"
                [ngClass]="{'arrow-disabled': messagesCollation.Page === (messagesPage ? messagesPage.PageCount : 1)}">
          <span>{{ 'UI.LABEL.DIRECTION.NEXT' | translate }}</span>
          <div app-icon name="ChevronRight" className="h-[22px] text-zinc-200"
               [ngClassName]="{'text-zinc-500': messagesCollation.Page === (messagesPage ? messagesPage.PageCount : 1)}"></div>
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="selectedMessage"
       class="flex flex-col items-start justify-start">
    <h1 class="text-zinc-200 font-bold text-2xl">{{ selectedMessage.Subject }}</h1>
    <p class="text-zinc-400 mt-2">
      Sent by <span class="font-bold">{{ selectedMessage.Sender }}</span> at <span
      class="font-bold">{{ selectedMessage.SentAt | date: 'medium' }}</span>
    </p>
    <div class="mt-6">
      <p class="text-zinc-400">{{ selectedMessage.Content }}</p>
    </div>
  </div>

</div>
