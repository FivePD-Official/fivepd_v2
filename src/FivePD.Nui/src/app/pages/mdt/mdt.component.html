<div id="main-overlay"
     class="fixed z-0 inset-0 w-screen h-screen bg-zinc-900 opacity-50">
</div>
<div id="modal-container"
     class="absolute inset-0 w-full bg-zinc-900 grid grid-rows-[80px_1fr] grid-cols-1"
     [ngClass]="{
        'top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 max-w-[95%] fhd:max-w-[90%] h-[90vh] rounded-xl': !windowMaximized,
        'h-full': windowMaximized
      }">
  <app-header/>
  <div class="grid grid-rows-1 overflow-hidden"
       [ngClass]="{
         'grid-cols-[90px_1fr]': isSidebarCollapsed && !dispatchMode,
         'grid-cols-[250px_1fr]': !isSidebarCollapsed && !dispatchMode,
         'grid-cols-1': dispatchMode,
       }">
    <app-sidebar *ngIf="!dispatchMode"/>
    <div class="w-full h-full overflow-x-hidden p-0 pb-14 pl-14 pr-14">
      <router-outlet/>
    </div>
  </div>
  <app-notification-wrapper/>
</div>
