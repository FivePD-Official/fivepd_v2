<app-page-header [title]="'LABEL.MY_SETTINGS.TITLE' | translate"/>

<app-container [rows]="2" [columns]="1">

  <div class="flex flex-col gap-4">
    <app-dynamic-form [formFields]="userDetailsFields"
                      (onSubmit)="onUserDetailsSubmit($event)"
                      [disableSubmitWithOriginalValue]="true"
                      [showSubmitButton]="true"/>
    @if (department) {
      <app-button [label]="'LABEL.CALLSIGN.EDIT' | translate"
                  variant="tertiary"
                  (onClick)="tryEditCallsign()"/>
    }
  </div>

  <!--  <div class="flex flex-col gap-4">-->
  <!--    <p class="common-title">Unit details</p>-->
  <!--  </div>-->

</app-container>
