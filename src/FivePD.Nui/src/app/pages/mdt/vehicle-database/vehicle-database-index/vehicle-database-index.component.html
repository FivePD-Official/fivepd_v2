<app-page-header [title]="'UI.LABEL.VEHICLE_DATABASE.TITLE' | translate"/>
<div class="grid grid-rows-1 grid-cols-[300px_1fr] gap-10 z-0">
  <div class="flex flex-col gap-10">
    <app-dynamic-form [title]="'UI.LABEL.VEHICLE_DATABASE.SEARCH.TITLE' | translate"
                      [subtitle]="'UI.LABEL.VEHICLE_DATABASE.SEARCH.SUBTITLE' | translate"
                      [submitButtonLabel]="'ACTION.SEARCH.TITLE' | translate"
                      buttonAlignment="full"
                      [formFields]="formFields"
                      (onSubmit)="collation$.next({Page:1, Filters: $event.value})"
                      [showSubmitButton]="true"/>
    @if ((recentlyViewedVehiclesCount | async) ?? 0 > 0) {
      <div class="flex flex-col gap-2">
        <p class="text-sm font-medium text-zinc-400 uppercase">
          {{ 'UI.LABEL.RECENTLY_VIEWED' | translate }}
        </p>
        @for (vehicle of recentlyViewedVehicles | async; track vehicle) {
          <div [routerLink]="'/mdt/vehicle-database/' + vehicle.Id"
               class="bg-zinc-800 rounded-md p-2 hover:cursor-pointer hover:bg-zinc-700">
            <p class="text-zinc-300 font-medium">
              {{ vehicle.LicensePlate }}
            </p>
          </div>
        }
      </div>
    }
  </div>

  <app-grid [columns]="columns"
            [data]="vehicles$ | async"
            [rowLinkResolver]="rowLinkResolver"
            [collation]="collation$ | async"
            (onCollationChange)="collation$.next($event)"/>
</div>
