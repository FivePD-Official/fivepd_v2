<app-page-header [title]="department?.Name ?? ('UI.LABEL.DEPARTMENT.SINGULAR' | translate)">
  <app-button [label]="'UI.ACTION.JOIN' | translate"
              [show]="!isUserInDepartment"
              variant="secondary"
              [disabled]="!!user?.UnitCallsign"
              tippy="You can't join while you are in a unit."
              [isEnabled]="!!user?.UnitCallsign"
              placement="left"
              (onClick)="joinDepartment()"/>
  <app-button [label]="'UI.ACTION.LEAVE' | translate"
              [show]="isUserInDepartment"
              variant="secondary"
              [disabled]="!!user?.UnitCallsign"
              tippy="You can't leave while you are in a unit."
              [isEnabled]="!!user?.UnitCallsign"
              placement="left"
              (onClick)="leaveDepartment()"/>
</app-page-header>

@if (mode === 'edit' && userService.userIsDepartmentManagerOrAdmin()) {

  @if (department) {
    <app-container [columns]="1" [rows]="2">
      <app-container [columns]="2">
        <app-container [columns]="2">
          @if (departmentSettingsForm) {
            <app-dynamic-form [title]="'UI.LABEL.DEPARTMENT.SETTINGS' | translate"
                              [formFields]="departmentSettingsForm"
                              [columns]="1"
                              [limitWidth]="false"
                              buttonAlignment="right"
                              [disableSubmitWithOriginalValue]="true"
                              (onSubmit)="onDepartmentSettingsSubmit($event)"
                              [showSubmitButton]="true"/>
          }
          <div class="flex flex-col gap-4">
            <app-button class="mt-4"
                        label="Edit member callsign format"
                        variant="tertiary"
                        (onClick)="tryEditMemberCallsignFormat()"/>
          </div>
        </app-container>
        <app-grid [title]="'UI.LABEL.DIVISION.PLURAL' | translate"
                  [buttons]="divisionsButtons"
                  [data]="divisions"
                  [columns]="divisionsColumns"
                  (onCollationChange)="onDivisionsCollationChange($event)"
                  (onCellAction)="getDivisions()"/>
      </app-container>
      @if (!department.UseGlobalRanks) {
        <app-grid [title]="'UI.LABEL.RANK.PLURAL' | translate"
                  [buttons]="ranksButtons"
                  [data]="departmentRanksPage"
                  [columns]="ranksColumns"
                  (onCollationChange)="onRanksCollationChange($event)"
                  (onCellAction)="getRanks()"/>
      }
    </app-container>
  }

} @else {

  @if (department) {
    <app-container [columns]="2">
      <app-grid [title]="'UI.LABEL.DIVISION.PLURAL' | translate"
                [buttons]="divisionsButtons"
                [data]="divisions"
                [columns]="divisionsColumns"
                (onCollationChange)="onDivisionsCollationChange($event)"
                (onCellAction)="getDivisions()"/>
      @if (!department.UseGlobalRanks) {
        <app-grid [title]="'UI.LABEL.RANK.PLURAL' | translate"
                  [buttons]="ranksButtons"
                  [data]="departmentRanksPage"
                  [columns]="ranksColumns"
                  (onCollationChange)="onRanksCollationChange($event)"
                  (onCellAction)="getRanks()"/>
      }
    </app-container>
  }

}

<app-grid [title]="'UI.LABEL.MEMBER.PLURAL' | translate"
          [data]="users"
          [columns]="usersColumns"
          (onCollationChange)="onUsersCollationChange($event)"
          (onCellAction)="getUsers()"
/>
