<app-page-header [title]="title">
  <app-button [label]="'UI.ACTION.JOIN' | translate"
              [show]="!isUserInDepartment"
              variant="secondary"
              (onClick)="joinDepartment()"/>
  <app-button [label]="'UI.ACTION.LEAVE' | translate"
              [show]="isUserInDepartment"
              variant="secondary"
              (onClick)="leaveDepartment()"/>
</app-page-header>

<ng-container *ngIf="user?.Admin ?? false; else notAdmin">
  <app-container *ngIf="department" [columns]="1" [rows]="2">
    <app-container [columns]="2">
      <app-dynamic-form
        *ngIf="departmentSettingsForm"
        [title]="'UI.LABEL.DEPARTMENT.SETTINGS' | translate"
        [formFields]="departmentSettingsForm"
        [columns]="2"
        [limitWidth]="false"
        buttonAlignment="right"
        [disableSubmitWithOriginalValue]="true"
        (onSubmit)="onDepartmentSettingsSubmit($event)"/>
      <app-grid
        [title]="'UI.LABEL.DIVISION.PLURAL' | translate"
        [buttons]="divisionsButtons"
        [data]="divisions"
        [columns]="divisionsColumns"
        (onCollationChange)="onDivisionsCollationChange($event)"
        (onCellAction)="getDivisions()"/>
    </app-container>
    <app-grid
      [title]="'UI.LABEL.RANK.PLURAL' | translate"
      [buttons]="ranksButtons"
      [data]="ranks"
      [columns]="ranksColumns"
      (onCollationChange)="onRanksCollationChange($event)"
      (onCellAction)="getRanks()"/>
  </app-container>
</ng-container>

<ng-template #notAdmin>
  <app-container *ngIf="department" [columns]="2">
    <app-grid
      [title]="'UI.LABEL.RANK.PLURAL' | translate"
      [buttons]="ranksButtons"
      [data]="ranks"
      [columns]="ranksColumns"
      (onCollationChange)="onRanksCollationChange($event)"
      (onCellAction)="getRanks()"/>
    <app-grid
      [title]="'UI.LABEL.DIVISION.PLURAL' | translate"
      [buttons]="divisionsButtons"
      [data]="divisions"
      [columns]="divisionsColumns"
      (onCollationChange)="onDivisionsCollationChange($event)"
      (onCellAction)="getDivisions()"/>
  </app-container>
</ng-template>

<app-grid
  [title]="'UI.LABEL.MEMBER.PLURAL' | translate"
  [data]="users"
  [columns]="usersColumns"
  (onCollationChange)="onUsersCollationChange($event)"
  (onCellAction)="getUsers()"/>
