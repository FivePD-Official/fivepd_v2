<div *ngIf="showTimerBar"
     class="absolute bottom-5 right-5 flex flex-row items-center rounded-sm bg-zinc-900 px-3 py-4 gap-4">
  <p class="text-lg text-white">
    {{ title }}
  </p>
  <div class="overflow-hidden h-[20px] w-[200px] rounded-sm border border-color">
    <div class="h-full bg-primary" [ngStyle]="{ width: percentage + '%' }"></div>
  </div>
</div>
