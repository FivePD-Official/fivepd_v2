@if (showTimerBar) {
  <div class="absolute bottom-5 right-5 flex flex-col items-start rounded-md bg-zinc-900 px-3 pt-2 pb-4 gap-2 shadow-lg">
    <p class="text-lg text-white font-medium">
      {{ title }}
    </p>
    <div class="overflow-hidden h-[20px] w-[200px] rounded-sm border border-color">
      <div class="h-full bg-primary transition-all duration-100 ease-linear rounded-sm" [ngStyle]="{ width: percentage + '%' }"></div>
    </div>
  </div>
}
