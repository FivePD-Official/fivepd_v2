@if (showTimerBar) {
  <div class="flex flex-col items-start rounded-lg bg-zinc-900 border border-zinc-800 px-3 pt-2 pb-4 gap-2 shadow-lg">
    <p class="text-zinc-200">
      {{ title }}
    </p>
    <div class="overflow-hidden h-[15px] w-[200px] rounded-sm border border-color">
      <div class="h-full bg-primary transition-all duration-100 ease-linear rounded-sm" [ngStyle]="{ width: percentage + '%' }"></div>
    </div>
  </div>
}
