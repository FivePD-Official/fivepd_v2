<form [formGroup]="form" [ngClass]="{ 'max-width-none': content.children.length }" (ngSubmit)="internalOnSubmit()">
  <p *ngIf="title" class="form-title">{{ title }}</p>
  <p *ngIf="subtitle" class="form-subtitle">{{ subtitle }}</p>
  <app-dynamic-form-input
    *ngFor="let field of formFields"
    [field]="field"
    [form]="form"
  ></app-dynamic-form-input>
  <app-button *ngIf="!content.children.length" [label]="'Save'" type="submit"></app-button>
  <div class="buttons-wrapper" #content>
    <ng-content></ng-content>
  </div>
</form>
