<div class="table-container">
  <div class="table-container-header">
    <p class="common-title">{{ title }}</p>
    <div *ngIf="buttons" class="buttons">
      <app-button
        *ngFor="let button of buttons"
        theme="secondary"
        [link]="button.link"
        [label]="button.label"
        [show]="button.show()"
        (onClick)="headerButtonOnClick(button)"
      ></app-button>
    </div>
  </div>

  <div class="common-bg table">
    <div class="table-row table-header">
      <div
        *ngFor="let column of formattedColumns"
        class="table-cell"
      >
        <p>{{ column.header }}</p>
      </div>
    </div>

    <form *ngIf="isAnyColumnFilterable" class="table-row table-filter">
      <div
        *ngFor="let column of formattedColumns"
        class="table-cell"
      >
        <app-dynamic-form-input *ngIf="column.filter" [field]="getFilterInput(column)" (onChange)="onFilterFormChange(column.accessorKey, $event.target.value)"></app-dynamic-form-input>
      </div>
    </form>

    <div
      *ngFor="let row of formattedRows"
      class="table-row"
    >
      <div *ngFor="let item of row" class="table-cell">
        <a [routerLink]="item.link" *ngIf="item.link && !item.actions">
          {{ item.value }}
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
          </svg>
        </a>
        <p *ngIf="!item.link && !item.actions">{{ item.value }}</p>
        <div *ngIf="!item.link && item.actions" class="table-cell-actions">
          <ng-container *ngFor="let action of item.actions">
            <app-button
              *ngIf="action.type === 'button'"
              theme="small"
              [label]="action.label"
              (onClick)="tableCellActionButtonClick(action, item)"
            >
            </app-button>
<!--            <Select-->
<!--              v-else-if="action.type === 'select'"-->
<!--              :default-item="{ id: 0, label: action.label }"-->
<!--              :items="(action as TableCellActionSelect<any>).items"-->
<!--              :selected-item-resolver="(selectItem) => (action as TableCellActionSelect<any>).selectedItemResolver(item.originalItem, selectItem.id)"-->
<!--              :on-select="(selected) => tableCellActionSelect(action, item, selected.id)"-->
<!--              size="small"-->
<!--            />-->
          </ng-container>
        </div>
      </div>
    </div>

    <div *ngIf="formattedRows?.length; else noData" class="table-pagination">
      <div class="pagination-inner">
        <button [disabled]="collation.Page === 1" (click)="toPreviousPage()">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
          </svg>
        </button>
        <button *ngIf="collation.Page > 1" (click)="toPage(collation.Page - 1)"><span>{{ collation.Page - 1 }}</span></button>
        <button class="active"><span>{{ collation.Page }}</span></button>
        <button *ngIf="collation.Page < (data ? data!.PageCount : 1)" (click)="toPage(collation.Page + 1)"><span>{{ collation.Page + 1 }}</span></button>
        <button [disabled]="collation.Page === (data ? data!.PageCount : 1)" (click)="toNextPage()">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        </button>
      </div>
    </div>

    <ng-template #noData>
      <p class="no-data">{{ 'Nui.Labels.NoDataToDisplay' | translate }}</p>
    </ng-template>
  </div>
</div>
