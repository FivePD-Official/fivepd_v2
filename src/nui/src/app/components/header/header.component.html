<header>
  <div class="department">
    <img src="" alt="">
    <p>{{ (user$ | async)?.Department?.Name ?? 'Not in dept' }}</p>
  </div>
  <div class="side-row">
    <div class="status-select" [ngClass]="{ 'status-select--open': isStatusSelectOpened }">
      <button class="status-select-btn" (click)="toggleStatusSelect()">
        <p>{{ 'state.global.localization.Nui.Labels.Status' }}: {{ currentStatus }}</p>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </button>
      <div *ngIf="isStatusSelectOpened" class="status-select-list">
        <button *ngFor="let status of statusList" (click)="changeStatus(status)">
          {{ status }}
        </button>
      </div>
    </div>
    <p class="user">
      Logged in as <b>{{ (user$ | async)?.Name }}</b>
    </p>
    <button class="close-btn" (click)="window.hide()">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
    </button>
  </div>
</header>
