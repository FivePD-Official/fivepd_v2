Database:
  Address: 127.0.0.1
  Port: 3306
  DatabaseName: fivepd
  User: root
  Password: root

Unit:
  MaxMembers: 0 # 0 = unlimited, 1+ = limited
  Join: free # free = anyone can join, request = players have to request to join

Callout:
  DispatchType: auto # auto = automatic dispatch, manual = manual dispatch
  MinIntervalInMs: 4000
  MaxIntervalInMs: 5000
  MaxActiveCallouts: 3 # 0 = unlimited, 0+ = limited
  DispatchTimeoutInMs: 30000 # dispatchers have 30 seconds to assign a unit to a callout
  DynamicDispatch: # dynamic dispatch is only available when DispatchType is set to auto
    Enabled: false # true = only units within the specified radius will be dispatched, false = all units
    Radius: 200 # radius measured from callout position

Peds:
  ChanceToReusePedHistory: 20 # should be between 0-100. the higher the number, the more likely that you'll "meet" with the same peds again
  Licenses:
    Driving:
      ChanceToHave: 100 # should be between 0-100. the higher the number, the more likely that a ped has a driving license
      ChanceForExpired: 10 # should be between 0-100. the higher the number, the more likely that a ped has an invalid driving license
    Fishing:
      ChanceToHave: 100
      ChanceForExpired: 100
    Hunting:
      ChanceToHave: 100
      ChanceForExpired: 50
    Ccw:
      ChanceToHave: 50
      ChanceForExpired: 0
  Warrants:
    ChanceToHaveAny: 10 # should be between 0-100. the higher the number, the more likely that a ped has a warrant
    MaxAmount: 2 # the maximum amount of warrants a ped can have
    Items:
      - Arrest Warrant
      - Search Warrant
      - Alias Warrant
      - Bench Warrant
      - Capias Warrant
      - Capias Pro Fine Warrant
      - Civil Capias Warrant
      - Fugitive Warrant
      - Governor's Warrant

Vehicles:
  Police:
    EnableSpikeStripInAllVehicles: true

ProgressionSystem:
  ExperiencePoints:
    Arrest: 100
    CalloutCompleted: 100
    Citation: 50
    Fine: 50
    Death: -50
    VehicleImpounded: 50

Features:
  DiscordRichPresence: true
  DutyNotification: true
  DisableWantedLevel: true
  DisableWantedLevelAllTime: false
  Backups: true
  ProgressionSystem: false

DispatchActions:
  - Title: Request backup
    OnSelect: [ RequestBackup ]
  - Title: Code 4
    Description: No assist needed
    OnSelect: [ CompleteCurrentCallout ]
  - Title: Code 99
    Description: EMERGENCY
    OnSelect: [ SetStatus, TriggerPanicMode ]
  - Title: 10-5
    Description: Break
    OnSelect: [ SetStatus, SetPlayerCanNotReceiveCallouts ]
  - Title: 10-7
    Description: Out of service
    OnSelect: [ SetStatus, SetPlayerOffDuty ]
  - Title: 10-8
    Description: In service
    OnSelect: [ SetStatus, SetPlayerOnDuty ]
  - Title: 10-15
    Description: Suspect in custody
    OnSelect: [ SetStatus ]
  - Title: 10-19
    Description: Returning to station
    OnSelect: [ SetStatus ]
