Database:
  Type: MYSQL # mysql or mariadb
  Name: fivepd
  Address: 127.0.0.1
  Port: 3306 # for mariadb when using the docker compose file, change to 3307
  User: root # for mariadb when using the docker compose file, change to 'user'
  Password: root

DefaultLanguage: en-US

Features:
  DiscordRichPresence: true
  DutyNotification: true
  DisableWantedLevel: true
  DisableWantedLevelAllTime: false
  Backups: true
  ProgressionSystem: false
  Messages: true

# DateFormat: MM-dd-yyyy TODO: not implemented yet

Unit:
  MaxMembers: 0 # 0 = unlimited, 1+ = limited
  Join: FREE # FREE = anyone can join, REQUEST = players have to request to join

Callout:
  DispatchType: AUTO # AUTO = automatic dispatch, MANUAL = manual dispatch
  MinIntervalInMs: 4000
  MaxIntervalInMs: 5000
  MaxActiveCallouts: 3 # 0 = unlimited, 0+ = limited
  DispatchTimeoutInMs: 30000 # dispatchers have 30 seconds to assign a unit to a callout
  AreaBasedDispatch: true # true = callouts will be dispatched to a unit only if the callout is within its department's area, false = callouts will be dispatched to a unit regardless of the callout's location
  DynamicDispatch: # dynamic dispatch is only available when DispatchType is set to AUTO
    Enabled: false # true = only units within the specified radius will be dispatched, false = all units
    Radius: 200 # radius measured from callout position

Mdt:
  Access: EVERYWHERE # EVERYWHERE, ONLY_VEHICLE, ONLY_SPECIFIC_LOCATIONS, ONLY_VEHICLE_AND_SPECIFIC_LOCATIONS - admins can access the MDT anywhere and can add locations in the settings 

Peds:
  ChanceToReuseData: 20 # should be between 0-100. the higher the number, the more likely that you'll "meet" with the same peds again
  Alcohol:
    ChanceToHave: 100 # 0-100;
    ChanceForOverLegalLimit: 50 # 0-100;
    LegalLimit: 0.08 # the legal limit of alcohol in blood
  Drugs:
    - Name: Marijuana
      ChanceToHave: 100 # 0-100;
    - Name: Cocaine
      ChanceToHave: 100 # 0-100;
    - Name: Meth
      ChanceToHave: 100 # 0-100;
    - Name: Heroin
      ChanceToHave: 100 # 0-100;  
  Licenses:
    Driving:
      ChanceToHave: 100 # should be between 0-100. the higher the number, the more likely that a ped has a driving license
      ChanceForExpired: 10 # should be between 0-100. the higher the number, the more likely that a ped has an invalid driving license
    Fishing:
      ChanceToHave: 100
      ChanceForExpired: 100
    Hunting:
      ChanceToHave: 100
      ChanceForExpired: 50
    Ccw:
      ChanceToHave: 50
      ChanceForExpired: 0
  Warrants:
    ChanceToHaveAny: 10 # should be between 0-100. the higher the number, the more likely that a ped has a warrant
    MaxAmount: 2 # the maximum amount of warrants a ped can have
    Items:
      - Arrest Warrant
      - Search Warrant
      - Alias Warrant
      - Bench Warrant
      - Capias Warrant
      - Capias Pro Fine Warrant
      - Civil Capias Warrant
      - Fugitive Warrant
      - Governor's Warrant

Vehicles:
  Documents:
    Insurance:
      ChanceToHave: 100 # should be between 0-100. the higher the number, the more likely that a ped has a driving license
      ChanceForExpired: 10 # should be between 0-100. the higher the number, the more likely that a ped has an invalid driving license
    Registration:
      ChanceToHave: 100
      ChanceForExpired: 100
  Police: # TODO: remove and move to the new ui vehicle config section
    EnableSpikeStripInAllVehicles: true # TODO: not implemented yet

ProgressionSystem:
  ExperiencePoints:
    Arrest: 100  # TODO: not implemented yet
    CalloutCompleted: 100
    TrafficStopCompleted: 100
    Citation: 50  # TODO: not implemented yet
    Fine: 50  # TODO: not implemented yet
    Death: -50  # TODO: not implemented yet
    VehicleImpounded: 50  # TODO: not implemented yet

AssistanceServices:
  SpawnType: AUTO # AUTO = automatic spawn locations, MANUAL = should specify SpawnLocations
  Ambulance:
    ChanceToRevive: 100 # should be between 0-100. the higher the number, the more likely that a ped will be revived
  SpawnLocations: # optional; only used when SpawnType is set to MANUAL, a random location will be picked for each type
    Ambulance:
      - X: 0
        Y: -1.5
        Z: 1
    TowTruck:
      - X: 0
        Y: -1.5
        Z: 1

Messages:
  CanSend: ALL # ALL = everyone can send messages, ADMIN = only admins can send messages

DispatchMenuItems:
  - Title: Request ID check from dispatch
    OnSelect: [ REQUEST_ID_CHECK ]
  - Title: Request license plate check from dispatch
    OnSelect: [ REQUEST_LICENSE_PLATE_CHECK ]
  - Title: Request backup
    OnSelect: [ REQUEST_BACKUP ]
  # - Divider: true TODO: place a divider between actions like request backup and check license of ped and statuses ???
  - Title: Code 4
    Description: No assist needed
    OnSelect: [ SET_AS_STATUS, COMPLETE_CURRENT_INCIDENT ] # COMPLETE_CURRENT_INCIDENT clears the current incident AND panic mode if active
  - Title: Code 99
    Description: EMERGENCY
    OnSelect: [ SET_AS_STATUS, ENABLE_PANIC_MODE ]
  - Title: 10-5
    Description: Break
    OnSelect: [ SET_AS_STATUS, SET_PLAYER_CAN_NOT_RECEIVE_CALLOUTS ]
  - Title: 10-7
    Description: Out of service
    OnSelect: [ SET_AS_STATUS, SET_PLAYER_OFF_DUTY ]
  - Title: 10-8
    Description: In service
    OnSelect: [ SET_AS_STATUS, SET_PLAYER_ON_DUTY ]
  - Title: 10-15
    Description: Suspect in custody
    OnSelect: [ SET_AS_STATUS ]
  - Title: 10-19
    Description: Returning to station
    OnSelect: [ SET_AS_STATUS ]