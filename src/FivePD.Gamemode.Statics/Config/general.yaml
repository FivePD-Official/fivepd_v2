Database:
  Address: 127.0.0.1
  Port: 3306
  DatabaseName: fivepd
  User: root
  Password: ''

Unit:
  Join: free

Callout:
  AutomaticGeneration: false
  MinIntervalInMs: 5000
  MaxIntervalInMs: 10000

FeatureFlags:
  DiscordRichPresence: true
  DutyNotification: true
  DisableWantedLevel: true
  DisableWantedLevelAllTime: false

Status:
  - Title: Code 4
    Description: No assist needed
    OnSelect: [ CompletesCurrentCallout ]
  - Title: Code 5
    Description: Stakeout
  - Title: Code 6
    Description: Responding from a long distance
  - Title: Code 7
    Description: Meal break
  - Title: Code 99
    Description: EMERGENCY
    OnSelect: [ TriggersPanicMode ]
  - Title: 10-5
    Description: Break
    OnSelect: [ SetsPlayerCanNotReceiveCallouts ]
  - Title: 10-6
    Description: Busy
  - Title: 10-7
    Description: Out of service
    OnSelect: [ SetsPlayerOffDuty ]
  - Title: 10-8
    Description: In service
    OnSelect: [ SetsPlayerOnDuty ]
  - Title: 10-15
    Description: Suspect in custody
  - Title: 10-19
    Description: Returning to station